<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat repartidores</title>
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--ink:#14213D;--card:#fff;--mine:#1F5FD6;--mine-ink:#fff;--muted:#5B6678;--line:#D5DAE1;--warn:#F2C94C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1624;--ink:#E8ECF3;--card:#1B2536;--mine:#3B82F6;--mine-ink:#fff;--muted:#93A0B5;--line:#2A3548}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:17px}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{background:#14213D;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700}
header small{color:#B8C2D6;font-size:14px}
header button{background:transparent;border:1px solid #4A5A7C;color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
#login{margin:auto;width:min(92%,380px);background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--line)}
#login h2{margin:0 0 4px;font-size:24px}
#login p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.primary{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--mine);color:#fff;font:inherit;font-weight:700}
button.secondary{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:600}
#err{color:#C0392B;min-height:22px;margin-top:10px;font-size:15px}
#chat{display:none;flex:1;min-height:0;flex-direction:column}
#list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-color:var(--mine)}
.msg .who{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.msg.mine .who{color:#D6E4FF}
.msg .time{font-size:12px;opacity:.7;margin-top:3px;text-align:right}
.msg a{color:inherit;font-weight:700}
.empty{margin:auto;color:var(--muted);text-align:center;padding:20px}
form{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
form input{flex:1}
form button{border:0;border-radius:10px;padding:0 16px;font:inherit;font-weight:700}
#send{background:var(--mine);color:#fff}
#loc{background:var(--warn);color:#14213D}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>Chat repartidores</h1><small id="who"></small></div>
    <button id="out" hidden>Salir</button>
  </header>

  <section id="login">
    <h2>Entra al grupo</h2>
    <p>Usa el correo que el administrador autorizó.</p>
    <label for="name">Tu nombre (solo al crear cuenta)</label>
    <input id="name" maxlength="20" autocomplete="nickname">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="pass">Contraseña (mínimo 6 caracteres)</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="primary" id="enter">Entrar</button>
    <button class="secondary" id="register">Crear cuenta</button>
    <div id="err" role="alert"></div>
  </section>

  <section id="chat">
    <div id="list" aria-live="polite"></div>
    <form id="form">
      <button type="button" id="loc" aria-label="Compartir ubicación">Ubicación</button>
      <input id="text" maxlength="500" placeholder="Escribe un mensaje" autocomplete="off">
      <button id="send">Enviar</button>
    </form>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyANJPfL5JtkP-1jlH3Xs76S_HvZiPrflKQ",
  authDomain: "newgenaration-f8719.firebaseapp.com",
  projectId: "newgenaration-f8719",
  storageBucket: "newgenaration-f8719.firebasestorage.app",
  messagingSenderId: "474138967778",
  appId: "1:474138967778:web:3fd21cfab171e7a00428bb",
  measurementId: "G-L7YBYM11GE"
};
/* ==================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let me = null, uid = null, unsub = null;

const ERRORS = {
  "auth/invalid-credential": "Correo o contraseña incorrectos.",
  "auth/invalid-email": "Escribe un correo válido.",
  "auth/email-already-in-use": "Ese correo ya tiene cuenta. Toca Entrar.",
  "auth/weak-password": "La contraseña necesita al menos 6 caracteres.",
  "auth/too-many-requests": "Demasiados intentos. Espera unos minutos.",
  "auth/network-request-failed": "Sin internet. Revisa tu conexión."
};

function show(logged){
  $("login").style.display = logged ? "none" : "block";
  $("chat").style.display = logged ? "flex" : "none";
  $("out").hidden = !logged;
  $("who").textContent = logged ? "Conectado como " + me : "";
}

$("enter").onclick = async () => {
  $("err").textContent = "";
  try{ await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch(e){ $("err").textContent = ERRORS[e.code] || "No se pudo entrar. Intenta de nuevo."; }
};

$("register").onclick = async () => {
  const n = $("name").value.trim();
  if(!n){ $("err").textContent = "Escribe tu nombre para crear la cuenta."; return; }
  $("err").textContent = "";
  try{
    const c = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    await updateProfile(c.user, { displayName: n });
    me = n; $("who").textContent = "Conectado como " + me;
  }catch(e){ $("err").textContent = ERRORS[e.code] || "No se pudo crear la cuenta."; }
};

$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if(unsub){ unsub(); unsub = null; }
  if(user){
    uid = user.uid;
    me = user.displayName || user.email.split("@")[0];
    show(true); listen();
  } else {
    uid = null; me = null; show(false);
  }
});

function fmt(ts){
  if(!ts) return "";
  return ts.toDate().toLocaleTimeString("es", {hour:"2-digit", minute:"2-digit"});
}

function notice(text){
  const list = $("list"); list.textContent = "";
  const e = document.createElement("div"); e.className = "empty"; e.textContent = text; list.appendChild(e);
}

function render(docs){
  const list = $("list");
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  list.textContent = "";
  if(!docs.length){ notice("Aún no hay mensajes. Escribe el primero."); return; }
  docs.forEach(m => {
    const d = document.createElement("div");
    d.className = "msg" + (m.uid === uid ? " mine" : "");
    const w = document.createElement("div"); w.className = "who"; w.textContent = m.name;
    const t = document.createElement("div");
    if(/^https:\/\/maps\.google\.com\/\?q=[-\d.,]+$/.test(m.text)){
      const a = document.createElement("a");
      a.href = m.text; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Ver ubicación en el mapa";
      t.appendChild(a);
    } else { t.textContent = m.text; }
    const h = document.createElement("div"); h.className = "time"; h.textContent = fmt(m.ts);
    d.append(w, t, h); list.appendChild(d);
  });
  if(nearBottom || docs.length < 2) list.scrollTop = list.scrollHeight;
}

function listen(){
  const q = query(collection(db, "messages"), orderBy("ts", "desc"), limit(100));
  unsub = onSnapshot(q,
    snap => { render(snap.docs.map(d => d.data()).reverse()); $("list").scrollTop = $("list").scrollHeight; },
    err => notice(err.code === "permission-denied"
      ? "Tu correo aún no está autorizado. Pide al administrador que te agregue."
      : "No se pudo conectar. Revisa tu internet.")
  );
}

async function post(text){
  try{ await addDoc(collection(db, "messages"), { name: me, text, ts: serverTimestamp(), uid }); }
  catch(e){ alert("No se envió el mensaje. Intenta de nuevo."); }
}

$("form").onsubmit = e => {
  e.preventDefault();
  const v = $("text").value.trim();
  if(!v) return;
  $("text").value = ""; post(v);
};

$("loc").onclick = () => {
  if(!navigator.geolocation){ alert("Tu teléfono no permite compartir ubicación."); return; }
  navigator.geolocation.getCurrentPosition(
    p => post("https://maps.google.com/?q=" + p.coords.latitude.toFixed(5) + "," + p.coords.longitude.toFixed(5)),
    () => alert("Activa el permiso de ubicación para compartirla."),
    { enableHighAccuracy: true, timeout: 10000 }
  );
};

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
